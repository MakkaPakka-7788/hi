  <div id="flashaccount-panel">
    <strong>FlashAccount</strong>
    <div id="flashaccount-status" role="status">Connecting...</div>
    <button id="flashaccount-login" type="button">Sign in with Google</button>
    <button id="flashaccount-logout" type="button" hidden>Sign out</button>
  </div>

  <script>
    window.addEventListener('beforeunload', (event) => {
      if (!window.__polytrackMultiplayerSessionActive) return;
      event.preventDefault();
      event.returnValue = '';
    });
  </script>

  <noscript>
    PolyTrack 0.6.3 Ranked requires JavaScript. Race official, community and Extra Tracks, save personal bests, and compete in daily and weekly events.
  </noscript>

  <script type="module">
    const status = document.getElementById("flashaccount-status");
    const loginButton = document.getElementById("flashaccount-login");
    const logoutButton = document.getElementById("flashaccount-logout");

    function updateUser(user) {
      if (user) {
        status.textContent = "Signed in as " +
          (user.displayName || user.email || "Google user");
        loginButton.hidden = true;
        logoutButton.hidden = false;
      } else {
        status.textContent = "Not signed in";
        loginButton.hidden = false;
        logoutButton.hidden = true;
      }
    }

    try {
      await import(
        "https://makkapakka-7788.github.io/MAKKASENTPAKKING-PoRtfolio/flashaccount.js"
      );

      const account = window.FlashAccount;

      if (!account) {
        throw new Error("FlashAccount did not initialize.");
      }

      loginButton.addEventListener("click", async () => {
        loginButton.disabled = true;
        status.textContent = "Opening Google sign-in...";

        try {
          await account.signInWithGoogle();
        } catch (error) {
          status.textContent = "Sign-in failed: " + error.message;
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener("click", async () => {
        logoutButton.disabled = true;

        try {
          await account.signOut();
        } catch (error) {
          status.textContent = "Sign-out failed: " + error.message;
        } finally {
          logoutButton.disabled = false;
        }
      });

      window.addEventListener("flashaccount-auth", event => {
        updateUser(event.detail);
      });

      updateUser(account.auth.currentUser);
    } catch (error) {
      console.error("FlashAccount error:", error);
      status.textContent = "Couldn't connect. Check the browser console.";
      loginButton.disabled = true;
      logoutButton.disabled = true;
    }
  </script>

  <script>
    (function(){
      let keys = [];
      const target = ["r", "r", "r"];

      window.addEventListener("keydown", function(e){
        if (
          e.defaultPrevented ||
          e.repeat ||
          e.ctrlKey ||
          e.metaKey ||
          e.altKey ||
          e.target?.isContentEditable ||
          e.target?.closest?.('input, textarea, select, [role="textbox"]')
        ) {
          keys = [];
          return;
        }

        keys.push(String(e.key || "").toLowerCase());

        if (keys.length > 3) keys.shift();

        if (keys.join("") === target.join("")) {
          window.location.href = "https://makkapakka-7788.github.io/makkapakka/flashcard.html";
        }
      });
    })();
  </script>
